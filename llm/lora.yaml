model: models/qwen2.5-3b-instruct
train: true
data: data/mlx
fine_tune_type: lora
mask_prompt: true
num_layers: 36
batch_size: 4
grad_checkpoint: true
iters: 1000
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [1.0e-4, 1000, 1.0e-6]
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
max_seq_length: 2048
steps_per_report: 20
steps_per_eval: 100
val_batches: 8
save_every: 250
adapter_path: adapters/chinnu-3b
seed: 7
