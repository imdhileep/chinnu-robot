name: ChinnuGlasses
options:
  bundleIdPrefix: com.dhileep
  deploymentTarget:
    iOS: "17.2"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ChinnuGlasses:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhileep.chinnuglasses
        PRODUCT_NAME: ChinnuGlasses
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Chinnu
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.dhileep.chinnuglasses
            CFBundleURLSchemes: [chinnuglasses]
        MWDAT:
          AppLinkURLScheme: "chinnuglasses://"
          MetaAppID: "0"
          ClientToken: ""
          TeamID: "$(DEVELOPMENT_TEAM)"
          Analytics:
            OptOut: true
        UIBackgroundModes: [audio, processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBluetoothAlwaysUsageDescription: Chinnu connects to your Meta glasses.
        NSMicrophoneUsageDescription: Chinnu listens through your glasses microphone.
        NSLocalNetworkUsageDescription: Lets your phone find and connect to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
